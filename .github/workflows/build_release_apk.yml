name: Build Release APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write client_secrets.json (if available)
        env:
          GOOGLE_CLIENT_SECRETS_JSON: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON }}
        run: |
          if [ -n "$GOOGLE_CLIENT_SECRETS_JSON" ]; then
            mkdir -p app/src/main/assets
            printf '%s\n' "$GOOGLE_CLIENT_SECRETS_JSON" > app/src/main/assets/client_secrets.json
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease -Penable-updater -PtargetAbi=arm64-v8a

      - name: Upload arm64-v8a Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release
          path: app/build/outputs/apk/release/*arm64-v8a*.apk
          if-no-files-found: error

      - name: Publish or Update GitHub Release
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v2.5.1"
          echo "Publishing or updating release for $tag..."
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists, updating assets..."
            gh release upload "$tag" app/build/outputs/apk/release/*.apk --clobber
          else
            echo "Creating release $tag..."
            printf '%s\n' \
              "### What's New in v2.5.1" \
              "- **AniList Artwork Aspect Ratio Fix**: Portrait 2:3 manga cards strictly retain native book covers, while high-resolution 1200x630 AniList banners are reserved for Hero backdrops." \
              "- **Real-Time Reading Progress**: Continue Reading cards now accurately display current page numbers (e.g. Ch. 5: p. 13) and non-zero progress bars for chapters in progress." \
              "- **Card Tap Action Setting**: Added setting in Settings -> Chimanew -> Card Tap Action (Open details page vs Open reader)." \
              "- **Instant Card Tap Speed**: Eliminated async database lookups when launching in-progress chapters." \
              "- **Recently Updated Shelf**: Renamed 'Recently Added' to 'Recently Updated'." \
              "- **Backup Tracker Logins**: Defaulted Private Settings to enabled so tracker sessions (AniList, MAL, Drive) are preserved during backup and restore." \
              > release_notes.md
            gh release create "$tag" \
              app/build/outputs/apk/release/*.apk \
              --title "Chimanew ($tag)" \
              --notes-file release_notes.md
          fi
