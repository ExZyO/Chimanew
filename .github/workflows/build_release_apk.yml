name: Build Release APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write client_secrets.json (if available)
        env:
          GOOGLE_CLIENT_SECRETS_JSON: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON }}
        run: |
          if [ -n "$GOOGLE_CLIENT_SECRETS_JSON" ]; then
            mkdir -p app/src/main/assets
            printf '%s\n' "$GOOGLE_CLIENT_SECRETS_JSON" > app/src/main/assets/client_secrets.json
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease -Penable-updater -PtargetAbi=arm64-v8a

      - name: Upload arm64-v8a Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release
          path: app/build/outputs/apk/release/*arm64-v8a*.apk
          if-no-files-found: error

      - name: Publish or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v2.4.9"
          echo "Publishing or updating release for $tag..."
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists, updating assets..."
            gh release upload "$tag" app/build/outputs/apk/release/*.apk --clobber
          else
            echo "Creating release $tag..."
            printf '%s\n' \
              "### What's New in v2.4.9" \
              "- **Dedicated In-App Updater for Chimanew**: Fixed updater repository target so update checks and background jobs correctly detect ExZyO/Chimanew releases instead of upstream Chimahon." \
              "- **Persistent Release Signing Key**: Replaced ephemeral debug runner keys with a permanent release keystore shared across local and CI builds. Eliminates 'Update failed' / certificate mismatch errors permanently." \
              "- **Robust Architecture Fallback**: Enhanced asset resolution so devices with any ABI can download release APKs seamlessly." \
              "- **All v2.4.8 Features Included**: Netflix/Nuvio Ambient Backdrop Hero, AniList 1200x630 HD banners, unified tracker shelves (Reading, Plan to read, On hold, Completed, Dropped, Not tracked), and smooth scroll header." \
              > release_notes.md
            gh release create "$tag" \
              app/build/outputs/apk/release/*.apk \
              --title "Chimanew ($tag)" \
              --notes-file release_notes.md
          fi
