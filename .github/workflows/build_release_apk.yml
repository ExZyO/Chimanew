name: Build Release APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write client_secrets.json (if available)
        if: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON != '' }}
        run: |
          mkdir -p app/src/main/assets
          cat << 'EOF' > app/src/main/assets/client_secrets.json
          ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON }}
          EOF

      - name: Build Release APK
        run: ./gradlew assembleRelease -Penable-updater -PtargetAbi=arm64-v8a

      - name: Upload arm64-v8a Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release
          path: app/build/outputs/apk/release/*arm64-v8a*.apk
          if-no-files-found: error

      - name: Publish or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v2.4.5"
          echo "Publishing or updating release for $tag..."
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists, updating assets..."
            gh release upload "$tag" app/build/outputs/apk/release/*.apk --clobber
          else
            echo "Creating release $tag..."
            gh release create "$tag" \
              app/build/outputs/apk/release/*.apk \
              --title "Chimahon Custom ($tag)" \
              --notes "Custom Release build (arm64-v8a, package: app.chimahon.custom) with Webtoon scroll acceleration and reading time estimate. Can be installed alongside normal Chimahon."
          fi
