name: Build Release APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write client_secrets.json (if available)
        env:
          GOOGLE_CLIENT_SECRETS_JSON: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON }}
        run: |
          if [ -n "$GOOGLE_CLIENT_SECRETS_JSON" ]; then
            mkdir -p app/src/main/assets
            printf '%s\n' "$GOOGLE_CLIENT_SECRETS_JSON" > app/src/main/assets/client_secrets.json
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease -Penable-updater -PtargetAbi=arm64-v8a

      - name: Upload arm64-v8a Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release
          path: app/build/outputs/apk/release/*arm64-v8a*.apk
          if-no-files-found: error

      - name: Publish or Update GitHub Release
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v2.5.3"
          echo "Publishing or updating release for $tag..."
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists, updating assets..."
            gh release upload "$tag" app/build/outputs/apk/release/*.apk --clobber
          else
            echo "Creating release $tag..."
            printf '%s\n' \
              "### What's New in v2.5.3" \
              "- **Upstream Merge (Chimahon v2.4.9)**: Fully synchronized with latest Chimahon: OPDS novel catalog support, MPV player updates, reader re-OCR controls, dictionary copy deduplication, and audio link fixes." \
              "- **Hero Banner Redesign (1:1 Option 1)**: Authentic widescreen banner artwork from publisher via AniList GraphQL, format/genre pill badge (e.g. MANHWA • ACTION), drop-shadow typography, 2-line clean synopsis, and white Netflix capsule resume button." \
              "- **AniList High-Res GraphQL Engine**: Replaced legacy social-card preview with native GraphQL query fetching genuine widescreen banners and extra-large portrait covers." \
              "- **Dual Tap Action Settings**: Independent tap behaviors for Continue Reading (default: Open reader) vs Library & Shelves (default: Open details page)." \
              "- **Dynamic Live Reactivity**: All preferences subscribe to flow updates—toggling settings takes effect immediately across Home without restarting the app." \
              "- **Active Chapter Reading Progress**: Real-time progress bar tracking the current chapter in progress, ensuring non-zero visual progress while reading." \
              "- **Hero Category Picker**: Multi-select dialog allowing you to choose which specific library categories appear in the Hero carousel." \
              "- **Cross-Fork Backup Compatibility**: 100% clean protobuf serialization compatible across Mihon, Komikku, and Chimahon." \
              > release_notes.md
            gh release create "$tag" \
              app/build/outputs/apk/release/*.apk \
              --title "Chimanew ($tag)" \
              --notes-file release_notes.md
          fi
