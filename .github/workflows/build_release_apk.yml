name: Build Release APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write client_secrets.json (if available)
        env:
          GOOGLE_CLIENT_SECRETS_JSON: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON }}
        run: |
          if [ -n "$GOOGLE_CLIENT_SECRETS_JSON" ]; then
            mkdir -p app/src/main/assets
            printf '%s\n' "$GOOGLE_CLIENT_SECRETS_JSON" > app/src/main/assets/client_secrets.json
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease -Penable-updater -PtargetAbi=arm64-v8a

      - name: Upload arm64-v8a Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release
          path: app/build/outputs/apk/release/*arm64-v8a*.apk
          if-no-files-found: error

      - name: Publish or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v2.4.7"
          echo "Publishing or updating release for $tag..."
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists, updating assets..."
            gh release upload "$tag" app/build/outputs/apk/release/*.apk --clobber
          else
            echo "Creating release $tag..."
            printf '%s\n' \
              "### What's New in v2.4.7" \
              "- **Nuvio Netflix-Style Home Tab**: Brand new landing experience with dynamic top Hero carousel and horizontal manga shelves." \
              "- **Dynamic Hero Carousel**: Auto-advancing banner with Palette ambient color glow, 1-tap chapter resume pill, and manga details on cover tap." \
              "- **Horizontal Manga Shelves**: Continue Reading (with 1-tap direct resume and long-press options), Recently Updated, and Library Categories." \
              "- **Sleek Cards**: Ambient bottom gradient fade, floating chapter progress, 2px progress bar, and unread badges." \
              "- **Nuvio Enhanced Settings**: Dedicated top-level settings section to toggle and configure Hero source, shelves, and card appearance." \
              "- **Google Drive Sync**: Pre-configured with client secrets." \
              > release_notes.md
            gh release create "$tag" \
              app/build/outputs/apk/release/*.apk \
              --title "Chimanew ($tag)" \
              --notes-file release_notes.md
          fi
