name: Build Release APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write client_secrets.json (if available)
        env:
          GOOGLE_CLIENT_SECRETS_JSON: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON }}
        run: |
          if [ -n "$GOOGLE_CLIENT_SECRETS_JSON" ]; then
            mkdir -p app/src/main/assets
            printf '%s\n' "$GOOGLE_CLIENT_SECRETS_JSON" > app/src/main/assets/client_secrets.json
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease -Penable-updater -PtargetAbi=arm64-v8a

      - name: Upload arm64-v8a Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release
          path: app/build/outputs/apk/release/*arm64-v8a*.apk
          if-no-files-found: error

      - name: Publish or Update GitHub Release
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v2.5.6"
          echo "Publishing or updating release for $tag..."
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists, updating assets..."
            gh release upload "$tag" app/build/outputs/apk/release/*.apk --clobber
          else
            echo "Creating release $tag..."
            printf '%s\n' \
              "### What's New in v2.5.6" \
              "- **Nuvio Liquid Glass Navbar with Auto-Hide on Scroll**: Real-time frosted blur navbar that smoothly collapses down on scroll down and expands on scroll up, matching Nuvio Mobile with a 0.5dp hairline divider, transparent indicator pills, and animated accent highlights." \
              "- **Third Hero Banner Style (Netflix Ambient with Crisp Banner)**: Crisp unblurred widescreen publisher banner backdrop + sharp 2:3 portrait book cover card with metadata and white resume button in foreground (Option 3)." \
              "- **Hero Banner Poster Alignment & Blur Fix**: Landscape posters and covers are now top-center aligned so character faces/heads are never cropped, with dark background placeholders to prevent empty blurs while loading." \
              "- **Tracker Categories for Hero Carousel**: Select which tracking lists (Reading, Plan to Read, On Hold, Completed, Dropped) populate the Hero carousel, with multi-select support in Settings." \
              "- **AniList Artwork on Manga Details Page**: Customizable manga details header backdrop with choices for artwork source (Wide Banner, High-Res Cover, Default Library Cover) and visual style (Cinematic Fade, Soft Atmospheric Blur, Full Opacity + Scrims, Standard Local Cover)." \
              "- **Google Drive OAuth 403 Clarification**: Reiterate test user registration protocol in Google Cloud Console for OAuth 'Testing' mode." \
              > release_notes.md
            gh release create "$tag" \
              app/build/outputs/apk/release/*.apk \
              --title "Chimanew ($tag)" \
              --notes-file release_notes.md
          fi
